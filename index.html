<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>今夜の気分は？</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 背景色レイヤー -->
  <div class="stage" aria-hidden="true"></div>

  <!-- 背景に散りばめる「？」はJavaScriptで動的生成 -->
  <div class="question-field" id="questionField" aria-hidden="true"></div>

  <main class="content">
    <p class="eyebrow" data-fade="1">今夜の気分は？</p>
    <h1 class="headline" data-fade="2">あなたは<br>どっち？</h1>

    <div class="choices" data-fade="3">
      <button type="button" class="choice choice--light" id="btnSing">
        歌いたい派
      </button>
      <button type="button" class="choice choice--dark" id="btnDrink">
        飲みたい派
      </button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
